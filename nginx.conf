server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # The dashboard is a single page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same origin as the UI, so the browser never issues a cross-origin request
    # (no CORS configuration needed) and the frontend keeps using a relative
    # /api/v1/dashboard URL, exactly like the dev server proxy.
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    15s;
    }

    # index.html must always be revalidated, otherwise clients can pin an old
    # bundle that no longer exists after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Angular emits content-hashed file names, so they can be cached forever.
    location ~* \.(?:js|css|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
